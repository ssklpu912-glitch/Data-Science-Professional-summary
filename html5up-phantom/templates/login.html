{% extends "base.html" %}
{% block title %}Sign in — LabLogbook{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Sign in to your LabLogbook account</p>
        </div>
        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}
            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label>Email address:</label>
                    <input type="email" id="email" name="email"
                           class="form-input" placeholder="abc@example.com"
                           required autofocus>
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="password" name="password"
                           class="form-input" placeholder="Your password"
                           required>
                </div>
                <button type="submit" class="btn-submit">Sign in</button>
            </form>
        </div>
        <p class="auth-switch">Don't have an account?
            <a href="{{ url_for('register') }}">Create one free</a>
        </p>
    </div>
</section>
{% endblock %}
