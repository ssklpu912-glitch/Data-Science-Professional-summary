{% extends "base.html" %}
{% block title %}Edit entry — LabLogbook{% endblock %}
{% block content %}
<header>
	<h1>Edit entry</h1>
	<p>Update the details below and save your changes.</p>
</header>

<div style="max-width: 900px; margin: 0 auto 3em auto; background: #f7f7f7; border-radius: 10px; padding: 2em;">
	<form method="POST">

		<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.2em; margin-bottom: 1.5em;">
			<div class="field">
				<label for="entry_datetime">Date &amp; time</label>
				<input type="datetime-local" id="entry_datetime" name="entry_datetime"
					   value="{{ entry.entry_datetime.strftime('%Y-%m-%dT%H:%M') }}" required />
			</div>
			<div class="field">
				<label for="title">Title</label>
				<input type="text" id="title" name="title" value="{{ entry.title }}" required />
			</div>
			<div class="field">
				<label for="exp_type">Type of experiment</label>
				<select id="exp_type" name="exp_type">
					{% for opt in exp_type_options %}
					<option value="{{ opt }}" {% if entry.exp_type == opt %}selected{% endif %}>{{ opt }}</option>
					{% endfor %}
				</select>
			</div>
			<div class="field">
				<label for="status">Status</label>
				<select id="status" name="status">
					{% for opt in status_options %}
					<option value="{{ opt }}" {% if entry.status == opt %}selected{% endif %}>{{ opt }}</option>
					{% endfor %}
				</select>
			</div>
		</div>

		<div class="field">
			<label for="objective">Objective / Hypothesis</label>
			<textarea id="objective" name="objective" rows="2">{{ entry.objective }}</textarea>
		</div>
		<div class="field">
			<label for="materials">Materials / Reagents</label>
			<textarea id="materials" name="materials" rows="2">{{ entry.materials }}</textarea>
		</div>
		<div class="field">
			<label for="procedure">Procedure / Method</label>
			<textarea id="procedure" name="procedure" rows="3">{{ entry.procedure }}</textarea>
		</div>

		<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.2em;">
			<div class="field">
				<label for="input_params">Input parameters</label>
				<textarea id="input_params" name="input_params" rows="3">{{ entry.input_params }}</textarea>
			</div>
			<div class="field">
				<label for="output_results">Output / Results</label>
				<textarea id="output_results" name="output_results" rows="3">{{ entry.output_results }}</textarea>
			</div>
		</div>

		<div class="field">
			<label for="observations">Observations</label>
			<textarea id="observations" name="observations" rows="2">{{ entry.observations }}</textarea>
		</div>
		<div class="field">
			<label for="conclusion">Conclusion</label>
			<textarea id="conclusion" name="conclusion" rows="2">{{ entry.conclusion }}</textarea>
		</div>

		<ul class="actions">
			<li><input type="submit" value="Save changes" class="primary" /></li>
			<li><a href="{{ url_for(entry.category) }}" class="button">Cancel</a></li>
		</ul>
	</form>
</div>
{% endblock %}
